name: Portable preloaded attachment
on:
  pull_request:
    paths: ["src/**", "pom.xml", ".github/workflows/attachment.yml"]
  push:
    branches: [main, master]
    paths: ["src/**", "pom.xml", ".github/workflows/attachment.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restricted-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress "-Dtest=AttachRestrictionTest,AgentOptionsTest,AgentCommandRegistryTest,AgentBytecodeCompatibilityTest,InspectorSessionRoutingTest,TunnelAgentDialogTest" "-Dit.test=DisabledAttachIT" verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restricted-jvm-${{ matrix.os }}-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
